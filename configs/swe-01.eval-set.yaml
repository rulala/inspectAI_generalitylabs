tasks:
  - package: "inspect_evals[swe_bench] @ git+https://github.com/UKGovernmentBEIS/inspect_evals.git@9080b5e9f1647ed14e45de8cb01e3d43411c0163"
    name: inspect_evals
    items:
      - name: swe_bench
        args:
          sandbox_type: k8s
        sample_ids:
          - "scikit-learn__scikit-learn-25102"
          - "mwaskom__seaborn-3187"
          - "sphinx-doc__sphinx-9658"
          - "psf__requests-1142"
          - "pytest-dev__pytest-10081"
