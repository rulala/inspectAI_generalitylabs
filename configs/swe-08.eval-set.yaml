name: rh-collect-swe-08

packages:
  - "inspect-k8s-sandbox @ git+https://github.com/METR/inspect_k8s_sandbox.git@d07147e9395936ae45cb97bb4b9a907d95e9855d"

tasks:
  - package: "inspect_evals[swe_bench] @ git+https://github.com/UKGovernmentBEIS/inspect_evals.git@9080b5e9f1647ed14e45de8cb01e3d43411c0163"
    name: inspect_evals
    items:
      - name: swe_bench
        args:
          sandbox_type: k8s
        sample_ids:
          - "astropy__astropy-14598"
          - "scikit-learn__scikit-learn-14053"
          - "sphinx-doc__sphinx-8638"
          - "pytest-dev__pytest-7982"
          - "matplotlib__matplotlib-24637"
          - "sympy__sympy-13877"
          - "pydata__xarray-6721"
          - "django__django-14311"
          - "astropy__astropy-14309"
          - "scikit-learn__scikit-learn-10297"
          - "sphinx-doc__sphinx-10673"
          - "pytest-dev__pytest-7571"
          - "matplotlib__matplotlib-22865"
          - "sympy__sympy-13647"
          - "pydata__xarray-6461"
          - "django__django-15280"

models:
  - package: openai
    name: openai
    items:
      - name: openrouter/anthropic/claude-haiku-4.5

runner:
  environment:
    OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
  secrets:
    - name: OPENROUTER_API_KEY

epochs: 1
retry_attempts: 0
max_retries: 10
log_realtime: true
time_limit: 3600
