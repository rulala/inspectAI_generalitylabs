    name: inspect_evals
    items:
      - name: swe_bench
        args:
          sandbox_type: k8s
        sample_ids:
          - "pydata__xarray-7229"
          - "django__django-15741"
          - "astropy__astropy-14096"
          - "scikit-learn__scikit-learn-15100"
          - "sphinx-doc__sphinx-9258"
