          - "django__django-11815"
          - "astropy__astropy-13033"
          - "scikit-learn__scikit-learn-12682"
          - "sphinx-doc__sphinx-10614"
          - "psf__requests-2317"
          - "pytest-dev__pytest-6202"
          - "pylint-dev__pylint-8898"
          - "matplotlib__matplotlib-20826"
